# suricata-update disable list (ET Open, Q3 in docs/CORPUS_V2.md). Not a rule
# file — Suricata only loads the files under `rule-files` in suricata.yaml.
#
#   docker exec suricata suricata-update --no-reload \
#     --disable-conf /etc/suricata/rules/disable.conf --output /etc/suricata/rules
#
# Suricata's own Modbus / DNP3 app-layer event rules: this lab doesn't enable
# those parsers, so the 16 rules fail to parse and `suricata -T` (which
# suricata-update runs before installing) rejects the whole ruleset.
re:alert (modbus|dnp3) any

# Tuning (applies to every mode alike): "SURICATA HTTP Response excessive header
# repetition" fires on the *response* of most DVWA pages, benign requests included
# (4/7 benign probes on EC2, 2026-10-25) — an artifact of the protected app, not
# of the client. Left on, `naive` flags nearly everything and almost every request
# looks "IDS-alerted", which erases the web-only source the agent_ids ablation needs.
2221036

# Tuning (applies to every mode alike): "ET INFO GNU/Linux APT User-Agent Outbound"
# fires on the sensor host's own package updates (Ubuntu apt-daily timers fetching
# from the mirrors over HTTP) — not traffic to the protected app, and no corpus
# request uses that user agent. One update burst raised 211 copies during an agent
# run on 2026-10-27; the agent triaged each one and fell >10 min behind.
2013504
