<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDS + Agent Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
  header { background: #161b22; padding: 16px 24px; border-bottom: 1px solid #30363d;
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.2rem; color: #58a6ff; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: .75rem; font-weight: 600; }
  .badge-live { background: #1a3a1a; color: #3fb950; border: 1px solid #3fb950; }
  .stats { display: flex; gap: 16px; padding: 20px 24px; flex-wrap: wrap; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
               padding: 16px 24px; min-width: 160px; }
  .stat-card .label { font-size: .75rem; color: #8b949e; margin-bottom: 4px; }
  .stat-card .value { font-size: 2rem; font-weight: 700; color: #f0f6fc; }
  .stat-card.red .value { color: #f85149; }
  .section { padding: 0 24px 24px; }
  .section h2 { font-size: .9rem; color: #8b949e; text-transform: uppercase;
                letter-spacing: .08em; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th { text-align: left; padding: 8px 12px; background: #161b22;
       color: #8b949e; font-weight: 500; border-bottom: 1px solid #30363d; }
  td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: #1c2128; }
  .action-block { color: #f85149; font-weight: 600; }
  .action-warn  { color: #e3b341; }
  .action-log   { color: #8b949e; }
  .attack { color: #58a6ff; font-family: monospace; font-size: .8rem; }
  .ts { color: #8b949e; font-size: .75rem; font-family: monospace; }
  .ip { font-family: monospace; }
  .refresh-hint { font-size: .75rem; color: #8b949e; padding: 0 24px 12px; }
</style>
</head>
<body>
<header>
  <h1>IDS + AI Agent Security Dashboard</h1>
  <span class="badge badge-live">LIVE</span>
</header>

<div class="stats" id="stats">
  <div class="stat-card"><div class="label">Total Events</div><div class="value" id="stat-total">—</div></div>
  <div class="stat-card red"><div class="label">IPs Blocked</div><div class="value" id="stat-blocked">—</div></div>
  <div class="stat-card"><div class="label">Top Attack</div><div class="value" style="font-size:1rem;padding-top:6px" id="stat-top-attack">—</div></div>
  <div class="stat-card"><div class="label">Top Attacker IP</div><div class="value" style="font-size:1rem;padding-top:6px" id="stat-top-ip">—</div></div>
  <div class="stat-card"><div class="label">Top MITRE Technique</div><div class="value" style="font-size:1rem;padding-top:6px" id="stat-top-mitre">—</div></div>
</div>

<div class="refresh-hint">Auto-refreshes every 5 seconds</div>

<div class="section">
  <h2>Recent Security Events</h2>
  <table>
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Source IP</th>
        <th>Attack Type</th>
        <th>MITRE</th>
        <th>Severity</th>
        <th>Action</th>
        <th>Analyst Note</th>
      </tr>
    </thead>
    <tbody id="events-body">
      <tr><td colspan="7" style="color:#8b949e;text-align:center;padding:32px">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
// Escape all DB-derived values before interpolating into innerHTML. Attack
// payloads (<script>, onerror=…) flow through the agent's note/reason fields,
// so unescaped rendering would execute attacker HTML in the analyst's browser.
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadStats() {
  const r = await fetch('/api/stats');
  const d = await r.json();
  document.getElementById('stat-total').textContent = d.total_events;
  document.getElementById('stat-blocked').textContent = d.total_blocked;
  document.getElementById('stat-top-attack').textContent =
    d.by_attack_type[0]?.attack || '—';
  document.getElementById('stat-top-ip').textContent =
    d.top_attacker_ips[0]?.src_ip || '—';
  document.getElementById('stat-top-mitre').textContent =
    d.by_mitre?.[0]?.mitre || '—';
}

const SEV_COLOR = {critical:'#f85149', high:'#f0883e', medium:'#e3b341', low:'#8b949e'};

async function loadEvents() {
  const r = await fetch('/api/events');
  const events = await r.json();
  const tbody = document.getElementById('events-body');
  if (!events.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="color:#8b949e;text-align:center;padding:32px">No events yet</td></tr>';
    return;
  }
  tbody.innerHTML = events.map(e => `
    <tr>
      <td class="ts">${esc(e.ts)}</td>
      <td class="ip">${esc(e.src_ip)}</td>
      <td class="attack">${esc(e.attack)}</td>
      <td class="attack">${esc(e.mitre)}</td>
      <td style="font-weight:600;color:${SEV_COLOR[e.severity] || '#8b949e'}">${esc((e.severity || '').toUpperCase())}</td>
      <td class="action-${esc(e.action || 'log')}">${esc((e.action || 'log').toUpperCase())}</td>
      <td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${esc(e.detail)}">${esc(e.note || e.detail)}</td>
    </tr>`).join('');
}

async function refresh() {
  await Promise.all([loadStats(), loadEvents()]);
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
