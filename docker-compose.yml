services:

  # ─── LAYER 1: Vulnerable Web App ───────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: dvwa_root
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: dvwa_pass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - security-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    environment:
      - DB_SERVER=mysql
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=dvwa_pass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - security-net
    restart: unless-stopped

  # Industry baseline for the A/B (mode `waf`): OWASP Core Rule Set on ModSecurity,
  # in the request path nginx -> waf -> dvwa. DetectionOnly: it scores and logs
  # every transaction but never blocks, so every mode sees identical traffic.
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    user: "0"                      # lab: lets it write the audit log into the shared volume
    environment:
      - BACKEND=http://dvwa:80
      - PORT=8080
      - MODSEC_RULE_ENGINE=DetectionOnly
      - MODSEC_AUDIT_ENGINE=On     # audit every request -> one decision per request
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_LOG_TYPE=Serial
      - MODSEC_AUDIT_LOG=/var/log/waf/audit.json
      - PARANOIA=1                 # CRS defaults: paranoia 1, inbound threshold 5
      - ANOMALY_INBOUND=5
    volumes:
      - waf-logs:/var/log/waf
    depends_on:
      - dvwa
    networks:
      - security-net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./webserver/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - waf
    networks:
      - security-net
    restart: unless-stopped

  # ─── LAYER 2: IDS ──────────────────────────────────────────────────────────

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      # not :ro — the jasonish/suricata entrypoint chowns these on boot and
      # exits if that fails (read-only bind mount -> crash loop).
      - ./ids/suricata.yaml:/etc/suricata/suricata.yaml
      - ./ids/rules:/etc/suricata/rules
      - suricata-logs:/var/log/suricata
    command: -c /etc/suricata/suricata.yaml --af-packet -l /var/log/suricata
    restart: unless-stopped

  # ─── LAYER 3: LLM ──────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      # the ollama image has no curl; use the bundled CLI (exit 0 when the
      # server is up, even before any model is pulled).
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── LAYER 3: AI Agent (LangGraph) ─────────────────────────────────────────

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent
    # host network so the agent shares the host netfilter tables: the
    # DOCKER-USER chain only exists in the host namespace, so a bridged agent
    # could never actually install the DROP rules it "blocks" with. Suricata
    # runs host-network for the same reason.
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - suricata-logs:/var/log/suricata:ro
      - nginx-logs:/var/log/nginx:ro
      - waf-logs:/var/log/waf:ro
      - ./agent/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1          # stream agent decisions to `docker logs` live
      - OLLAMA_HOST=http://localhost:11434
      - OLLAMA_MODEL=qwen2.5:14b
      - EVE_LOG=/var/log/suricata/eve.json
      - NGINX_LOG=/var/log/nginx/access.json.log
      - WAF_LOG=/var/log/waf/audit.json
      - DASHBOARD_DB=/app/data/events.db
      - RESPONSE_MODE=${RESPONSE_MODE:-agent}
      - BLOCK_ENABLED=${BLOCK_ENABLED:-true}
      - MEMORY_ENABLED=${MEMORY_ENABLED:-false}
      - EPOCH=${EPOCH:-0}
      - EMBED_MODEL=nomic-embed-text
      # headless (benchmark): auto-approve high-risk blocks. AUTO_APPROVE=false = real
      # HITL (G5): escalated blocks wait for an answer on the dashboard / approve.py
      - AUTO_APPROVE=${AUTO_APPROVE:-true}
      - HITL_ALL_BLOCKS=${HITL_ALL_BLOCKS:-false}   # true: every block asks, not only < 0.90
      - HITL_TIMEOUT_S=${HITL_TIMEOUT_S:-900}       # unanswered -> warn, never a block
      # Optional LangSmith tracing (bài 10) — "glass box" traces of every
      # node / LLM / tool call. Set API key + TRACING_V2=true to enable.
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-agent-ids}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ─── LAYER 4: Dashboard ────────────────────────────────────────────────────

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "5000:5000"
    volumes:
      # rw only for the HITL approvals table (POST /api/approvals/<eid>); everything else is read
      - ./agent/data:/app/data
    environment:
      - DB_PATH=/app/data/events.db
      - APPROVAL_TOKEN=${APPROVAL_TOKEN:-}     # unset = approve buttons disabled
    networks:
      - security-net
    restart: unless-stopped

networks:
  security-net:
    driver: bridge

volumes:
  mysql-data:
  nginx-logs:
  suricata-logs:
  waf-logs:
  ollama-models:
