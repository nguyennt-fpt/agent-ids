worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_body":"$request_body",'
            '"request_time":$request_time'
        '}';

    # Benchmark actors arrive in X-Forwarded-For (docs/CORPUS_V2.md §4). Trust
    # it only from the docker bridge / loopback — the local replay reaches nginx
    # through docker-proxy — so outside clients can't pick their own IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # write to a real file (not the image's access.log -> /dev/stdout symlink) so
    # the agent's 2nd source can read it without blocking on the stdout pipe.
    access_log /var/log/nginx/access.json.log json_combined;

    # Loose DoS guard. Raised well above the benchmark replay rate (~2 req/s)
    # so the harness traffic is never throttled — a 30r/m limit silently 503'd
    # most of the corpus and distorted the measurements.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=1200r/m;

    server {
        listen 80;
        server_name _;

        limit_req zone=per_ip burst=100 nodelay;

        location / {
            # through the WAF (OWASP CRS, DetectionOnly: logs, never blocks) to DVWA
            proxy_pass         http://waf:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
